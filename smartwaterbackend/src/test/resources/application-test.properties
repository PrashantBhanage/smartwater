# ============================================================
# Test profile — uses H2 in PostgreSQL-compatibility mode
# No Docker/Testcontainers required.
# ============================================================

# H2 datasource (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:water_billing_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable JPA dialect auto-detection — use H2 for tests
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway — still applies migrations; H2 PostgreSQL mode handles most syntax
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT test secret (Base64, 256-bit key — safe to commit for tests only)
JWT_SECRET=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcHVycG9zZXM=
JWT_EXPIRATION_MS=3600000

# Show SQL in tests for debugging
spring.jpa.show-sql=true

# Placeholder DB_PASSWORD (H2 doesn't use DB_PASSWORD from main properties)
DB_PASSWORD=test-password-placeholder
