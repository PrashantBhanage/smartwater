# ============================================================
# SmartWater Billing System — application.properties
# All sensitive values are loaded from environment variables.
# For local dev: set spring.profiles.active=local and fill in
# application-local.properties (gitignored).
# ============================================================

# --- DataSource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/water_billing_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Flyway manages the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Multipart (CSV upload) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Server ---
server.port=8080
server.error.include-message=always

# --- Alerts / scheduling ---
app.alerts.scheduler.enabled=true
app.alerts.scheduler.cron=0 0 2 * * *
app.mail.enabled=false
app.mail.from=noreply@smartwater.local