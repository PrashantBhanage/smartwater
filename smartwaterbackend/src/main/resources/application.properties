# --- DataSource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartwaterdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:prashant.0927}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Flyway manages the schema; Hibernate set to validate to prevent DDL conflicts
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Multipart (CSV upload) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Server ---
server.port=8080
server.error.include-message=always

# --- CORS (Vite may bind 5173, 5174, …) ---
# Comma-separated origin patterns. Override via APP_CORS_ALLOWED_ORIGIN_PATTERNS.
app.cors.allowed-origin-patterns=http://localhost:517*,http://127.0.0.1:517*

# --- Alerts / scheduling ---
app.alerts.scheduler.enabled=true
app.alerts.scheduler.cron=0 0 2 * * *
app.mail.enabled=false
app.mail.from=noreply@smartwater.local

# --- JavaMail / SMTP ---
# Credentials come from environment variables; defaults target Gmail STARTTLS.
# Override MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD in production.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base URL used to build invoice download links in emails
app.mail.base-url=${APP_BASE_URL:http://localhost:8080}